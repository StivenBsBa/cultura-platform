services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner

    environment:
      DATABASE_URL: ${EXTERNAL_DATABASE_URL:-postgresql://${POSTGRES_USER:-cultura}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cultura_platform}?schema=public}
      REDIS_URL: redis://redis:6379

      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}

      NODE_ENV: production

      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-cultura-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      S3_FORCE_PATH_STYLE: "true"

      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      GEOAPIFY_BASE_URL: ${GEOAPIFY_BASE_URL:-https://api.geoapify.com}

    ports:
      - "3000:3000"

    networks:
      - public
      - backend

    depends_on:
      bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-bucket-init:
        condition: service_completed_successfully

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    logging:
      options:
        max-size: "10m"
        max-file: "3"

  bootstrap:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: bootstrap

    environment:
      DATABASE_URL: ${EXTERNAL_DATABASE_URL:-postgresql://${POSTGRES_USER:-cultura}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cultura_platform}?schema=public}
      EXTERNAL_DATABASE_URL: ${EXTERNAL_DATABASE_URL:-}
      RUN_DB_SEED: ${RUN_DB_SEED:-}

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

    networks:
      - backend
      - public

  rustfs-init:
    image: busybox:1.37

    command: ["sh", "-c", "mkdir -p /data && chown -R 10001:10001 /data"]

    volumes:
      - ${RUSTFS_DATA_DIR:-/srv/cultura-platform/rustfs}:/data

    restart: "no"

    networks:
      - backend

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6

    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001

      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      RUSTFS_REGION: ${S3_REGION:-us-east-1}

      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS:-http://localhost:3000}

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    volumes:
      - ${RUSTFS_DATA_DIR:-/srv/cultura-platform/rustfs}:/data

    depends_on:
      rustfs-init:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    networks:
      - public
      - backend

    logging:
      options:
        max-size: "10m"
        max-file: "3"

  rustfs-bucket-init:
    image: rustfs/rc:latest

    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-cultura-media}
      S3_REGION: ${S3_REGION:-us-east-1}

    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        attempt=1
        max_attempts=20

        until /usr/bin/rc alias set rustfs http://rustfs:9000 "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}" --region "$${S3_REGION}" --bucket-lookup path; do
          if [ "$$attempt" -ge "$$max_attempts" ]; then
            echo "RustFS alias configuration failed after $$max_attempts attempts."
            exit 1
          fi

          echo "Waiting for RustFS alias configuration... attempt $$attempt/$$max_attempts"
          attempt=$$((attempt + 1))
          sleep 2
        done

        /usr/bin/rc ls "rustfs/$${S3_BUCKET}" >/dev/null 2>&1 || /usr/bin/rc bucket create "rustfs/$${S3_BUCKET}"

    depends_on:
      rustfs:
        condition: service_healthy

    restart: "no"

    networks:
      - backend

  postgres:
    image: postgis/postgis:17-3.5

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cultura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cultura_platform}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-postgis.sql:ro

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cultura} -d ${POSTGRES_DB:-cultura_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

    networks:
      - backend
      - public

    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine

    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - redis_data:/data

    ports:
      - "127.0.0.1:6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

    networks:
      - backend
      - public

    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:

networks:
  public:

  backend:
    internal: true